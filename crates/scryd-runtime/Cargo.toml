[package]
name = "scryd-runtime"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["signal", "rt-multi-thread", "macros", "sync"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
scryd-config = { path = "../scryd-config" }
scryd-log = { path = "../scryd-log" }
scryd-storage = { path = "../scryd-storage" }
scryd-search = { path = "../scryd-search" }
scryd-imap = { path = "../scryd-imap" }
scryd-mime = { path = "../scryd-mime" }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
