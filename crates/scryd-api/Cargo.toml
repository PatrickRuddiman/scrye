[package]
name = "scryd-api"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = "0.5"
tower-service = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "service"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
nix = { version = "0.29", features = ["socket", "user", "fs"] }
scryd-log = { path = "../scryd-log" }
scryd-storage = { path = "../scryd-storage" }
scryd-search = { path = "../scryd-search" }
scryd-config = { path = "../scryd-config" }
scryd-imap = { path = "../scryd-imap" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
mime = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json"] }
tempfile = "3"
# env-var manipulation is process-global, so the SCRYD_ALLOWED_UID
# tests serialise via #[serial] to keep concurrent tests from racing
# on the env var.
serial_test = "3"
