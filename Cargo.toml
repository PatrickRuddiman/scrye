[workspace]
resolver = "2"
members = [
    "crates/scryd-config",
    "crates/scryd-log",
    "crates/scryd-storage",
    "crates/scryd-mime",
    "crates/scryd-search",
    "crates/scryd-imap",
    "crates/scryd-api",
    "crates/scryd-runtime",
    "crates/scryd-fetch-weights",
    "scryd",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
version = "0.3.0"
# scryd ships only via GitHub Releases; no crate is published to
# crates.io. Marking the workspace `publish = false` matches that
# distribution model and lets cargo-deny's `allow-wildcard-paths`
# apply to our intra-workspace `path = "..."` deps.
publish = false

[workspace.dependencies]
tokio = "1.40"
axum = "0.7"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rusqlite = "0.35"
serde = "1"
serde_json = "1"
clap = "4.5"
rpassword = "7"
toml_edit = "0.22"
reqwest = "0.12"
mail-parser = "0.9"
htmd = "0.1"
async-imap = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
secrecy = "0.10"
zeroize = "1"
thiserror = "1"
anyhow = "1"

# dropbox/witchcraft is the production semantic search engine for scryd's
# search-engine slice. Per build-and-packaging slice §3 Decision 2:
#   x86_64-linux:  features = ["t5-quantized","fbgemm","hybrid-dequant"]
#   aarch64-linux: features = ["t5-quantized"]
# Per-arch feature selection lives in target-conditional dep tables in
# crates/scryd-search/Cargo.toml; this entry pins the revision only and
# is brought in only when the `witchcraft-backend` feature is enabled
# on scryd-search (default off).
witchcraft = { git = "https://github.com/dropbox/witchcraft", rev = "1370cd569c7a882815cc22169f52dc9aa195cda7", default-features = false }
candle-core = { git = "https://github.com/huggingface/candle", rev = "5bd5618", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
