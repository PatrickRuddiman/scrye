[package]
name = "scryd-search"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { version = "1", features = ["v5"] }
scryd-storage = { path = "../scryd-storage" }
scryd-log = { path = "../scryd-log" }

# Witchcraft is the REQUIRED production indexer — semantic search is a
# core feature of scryd, not an opt-in backend. Per-arch / per-OS
# feature sets mirror build-and-packaging slice §3 Decision 2 + the
# upstream README's recommended sets. The binding only resolves on
# Unix targets (candle / fbgemm-rs are Linux/macOS-only for scryd's
# purposes); a Windows port is a separate, non-trivial effort. On
# Windows the deps are simply absent and `WitchcraftIndexer` is gated
# out at the source level (see lib.rs), leaving the build clean for
# unit-testing the storage/search traits with `InMemoryIndexer`.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
witchcraft = { workspace = true, features = ["t5-quantized", "fbgemm", "hybrid-dequant"] }
candle-core = { workspace = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
witchcraft = { workspace = true, features = ["t5-quantized"] }
candle-core = { workspace = true }

# Apple Silicon: t5-quantized + metal (witchcraft README's recommended
# Apple Silicon set).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
witchcraft = { workspace = true, features = ["t5-quantized", "metal"] }
candle-core = { workspace = true }

# Intel Mac: t5-quantized + fbgemm + hybrid-dequant (witchcraft
# README's recommended Intel Mac set).
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
witchcraft = { workspace = true, features = ["t5-quantized", "fbgemm", "hybrid-dequant"] }
candle-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json"] }
tempfile = "3"

# The witchcraft integration test only compiles where the upstream
# binding resolves (Linux/macOS); the test file itself is gated with
# `#![cfg(any(target_os = "linux", target_os = "macos"))]` so it's an
# empty compilation unit on other hosts.
[[test]]
name = "witchcraft"
path = "tests/witchcraft.rs"
