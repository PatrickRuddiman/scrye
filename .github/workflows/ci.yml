name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-check:
    name: license check (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test:
    name: cargo test + install + e2e
    needs: license-check
    runs-on: ubuntu-22.04
    services:
      greenmail:
        image: greenmail/standalone:latest
        env:
          GREENMAIL_OPTS: "-Dgreenmail.smtp.hostname=0.0.0.0 -Dgreenmail.smtp.port=3025 -Dgreenmail.imap.hostname=0.0.0.0 -Dgreenmail.imap.port=3143 -Dgreenmail.users=test:test@localhost -Dgreenmail.auth.disabled"
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-x86_64-unknown-linux-gnu

      - name: verify systemd unit template
        run: |
          set -euo pipefail
          # systemd-analyze verify rejects the unit if ExecStart points
          # at a missing binary; stage a no-op executable at the real
          # path to satisfy the check on a fresh runner. It also
          # rejects filenames without a unit-type extension, so the
          # template gets copied to /tmp/scryd.service first.
          sudo install -m 0755 /bin/true /usr/local/bin/scryd
          rendered="$(mktemp -d)/scryd.service"
          cp ops/scryd.service.in "$rendered"
          systemd-analyze verify "$rendered"
          sudo rm /usr/local/bin/scryd
        shell: bash

      - name: cache T5 weights bundle
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: weights-cache/xtr-weights.gguf
          key: xtr-weights-${{ hashFiles('crates/scryd-fetch-weights/src/main.rs') }}

      - name: cargo test --workspace
        run: cargo test --workspace --target x86_64-unknown-linux-gnu
        shell: bash

      - name: cargo build --release
        run: cargo build --release --target x86_64-unknown-linux-gnu -p scryd -p scryd-fetch-weights
        shell: bash

      - name: stage release binaries at the path the e2e harness expects
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/scryd target/release/scryd
          cp target/x86_64-unknown-linux-gnu/release/scryd-fetch-weights target/release/scryd-fetch-weights
        shell: bash

      - name: install.sh smoke test
        run: bash tests/install_sh.sh
        shell: bash

      - name: prime weights cache for e2e
        run: |
          set -euo pipefail
          if [[ -f weights-cache/xtr-weights.gguf ]]; then
            sudo install -d -o root -g root -m 0755 /var/lib/scryd/assets
            sudo install -m 0644 weights-cache/xtr-weights.gguf /var/lib/scryd/assets/xtr-weights.gguf
          fi
        shell: bash

      - name: e2e imap-to-search smoke
        run: |
          # GreenMail is up on the runner's localhost via the services:
          # block. The harness self-relaunches inside a privileged
          # debian:bookworm container with --network host so the inner
          # container reaches GreenMail at 127.0.0.1:3143.
          bash tests/e2e_imap_to_search.sh
        shell: bash

      - name: stash weights for next cache save
        if: always()
        run: |
          set -euo pipefail
          if [[ -f /var/lib/scryd/assets/xtr-weights.gguf ]]; then
            mkdir -p weights-cache
            sudo cp /var/lib/scryd/assets/xtr-weights.gguf weights-cache/xtr-weights.gguf
            sudo chown "$(id -u)":"$(id -g)" weights-cache/xtr-weights.gguf
          fi
        shell: bash
