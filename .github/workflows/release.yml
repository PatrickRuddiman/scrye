name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts but skip the GitHub release upload"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  license-check:
    name: license check (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (${{ matrix.target }})
    needs: license-check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross
        if: matrix.cross == true
        run: cargo install cross --locked --version 0.2.5

      - name: verify systemd unit
        run: systemd-analyze verify ops/scryd.service

      - name: cargo test --workspace
        if: matrix.cross == false
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: cargo build --release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p scryd -p scryd-fetch-weights
          else
            cargo build --release --target ${{ matrix.target }} -p scryd -p scryd-fetch-weights
          fi

      - name: package tarball
        id: package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          stage="$(mktemp -d)"
          out="scryd-${tag}-${{ matrix.arch }}-linux"
          mkdir -p "$stage/$out"
          cp "target/${{ matrix.target }}/release/scryd" "$stage/$out/"
          cp "target/${{ matrix.target }}/release/scryd-fetch-weights" "$stage/$out/"
          cp ops/scryd.service "$stage/$out/"
          cp ops/install.sh "$stage/$out/"
          cp ops/README.install.md "$stage/$out/"
          cp LICENSE "$stage/$out/"
          tar -czf "${out}.tar.gz" -C "$stage" "$out"
          sha256sum "${out}.tar.gz" | awk '{print $1}' > "${out}.sha256"
          echo "tarball=${out}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${out}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat ${out}.sha256)" >> "$GITHUB_OUTPUT"

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scryd-${{ matrix.arch }}-linux
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha256_file }}

      - name: publish to github release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha256_file }}
          fail_on_unmatched_files: true
          generate_release_notes: true
