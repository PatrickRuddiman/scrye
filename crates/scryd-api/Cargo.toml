[package]
name = "scryd-api"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = "0.5"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
nix = { version = "0.29", features = ["socket", "user"] }
scryd-log = { path = "../scryd-log" }
scryd-storage = { path = "../scryd-storage" }
scryd-search = { path = "../scryd-search" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json"] }
tempfile = "3"
