[workspace]
resolver = "2"
members = [
    "crates/scryd-config",
    "crates/scryd-log",
    "crates/scryd-storage",
    "crates/scryd-mime",
    "crates/scryd-search",
    "crates/scryd-imap",
    "crates/scryd-api",
    "crates/scryd-runtime",
    "scryd",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
tokio = "1.40"
axum = "0.7"
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
rusqlite = "0.31"
serde = "1"
serde_json = "1"
clap = "4.5"
rpassword = "7"
toml_edit = "0.22"
reqwest = "0.12"
mail-parser = "0.9"
htmd = "0.1"
async-imap = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
secrecy = "0.10"
zeroize = "1"
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
