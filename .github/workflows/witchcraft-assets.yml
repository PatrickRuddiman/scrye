name: witchcraft-assets

# Build the XTR GGUF asset bundle scryd's daemon consumes at runtime.
# scryd-search is built with witchcraft's `t5-quantized` backend
# (mirrors the upstream `make warp-cli` feature set), which loads:
#   config.json
#   tokenizer.json
#   xtr.gguf
# `downloadweights.py` produces config.json + tokenizer.json +
# xtr.safetensors from `google/xtr-base-en`; the upstream
# `quantize-tool` rust binary converts xtr.safetensors -> xtr.gguf.
# The three result files are uploaded to a github release tagged
# `witchcraft-assets-<short-rev>` so scryd's release.yml and the
# install-time fetcher can curl a fixed URL with a pinned SHA-256.
#
# Run manually via `gh workflow run witchcraft-assets.yml`. The
# job is idempotent: re-running it replaces the existing release
# assets in place.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Same pin scryd-search uses in the workspace Cargo.toml.
  WITCHCRAFT_REV: 1370cd569c7a882815cc22169f52dc9aa195cda7

jobs:
  build:
    name: build xtr-int4 asset bundle
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: short rev
        id: rev
        run: |
          set -euo pipefail
          echo "short=${WITCHCRAFT_REV:0:7}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: clone witchcraft @ pinned rev
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/dropbox/witchcraft witchcraft-src
          (cd witchcraft-src && git checkout "$WITCHCRAFT_REV")
        shell: bash

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: install python deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The t5-quantized path only needs the python pieces that
          # downloadweights.py exercises (torch+transformers to load
          # google/xtr-base-en, safetensors to write the intermediate
          # bundle, huggingface_hub for the snapshot download).
          # openvino + nncf are skipped — quantize-tool (rust) does
          # the GGUF conversion.
          python -m pip install \
            "torch==2.4.1" \
            "transformers==4.46.3" \
            "huggingface_hub" \
            "safetensors"
        shell: bash

      - name: cache hugging face hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-google-xtr-base-en

      - name: run downloadweights.py
        run: |
          set -euo pipefail
          cd witchcraft-src
          python downloadweights.py
        shell: bash

      - name: run quantize-tool (xtr.safetensors -> assets/xtr.gguf)
        run: |
          set -euo pipefail
          cd witchcraft-src
          # quantize-tool ingests xtr.safetensors (produced by
          # downloadweights.py at the repo root) and writes the
          # GGUF-quantized weights to assets/xtr.gguf, alongside
          # the config.json / tokenizer.json the script already
          # copied there.
          cargo run -p quantize-tool --release -- xtr.safetensors assets/xtr.gguf
        shell: bash

      - name: stage assets
        id: stage
        run: |
          set -euo pipefail
          out="xtr-gguf-${{ steps.rev.outputs.short }}"
          mkdir -p "$out"
          cp witchcraft-src/assets/config.json    "$out/"
          cp witchcraft-src/assets/tokenizer.json "$out/"
          cp witchcraft-src/assets/xtr.gguf       "$out/"
          tarball="${out}.tar.gz"
          tar -czf "$tarball" "$out"
          sha256sum "$tarball" | awk '{print $1}' > "${out}.sha256"
          ls -la "$out"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${out}.sha256" >> "$GITHUB_OUTPUT"
          echo "bundle_dir=$out" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xtr-gguf-${{ steps.rev.outputs.short }}
          path: |
            ${{ steps.stage.outputs.tarball }}
            ${{ steps.stage.outputs.sha256_file }}

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.stage.outputs.tarball }}
          SHA_FILE: ${{ steps.stage.outputs.sha256_file }}
          REV: ${{ steps.rev.outputs.short }}
        run: |
          set -euo pipefail
          tag="witchcraft-assets-${REV}"
          # If the release already exists, delete its existing assets so
          # the upload-step doesn't choke on a conflict; otherwise create.
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          GGUF-quantized XTR T5 encoder produced from dropbox/witchcraft@${REV} via downloadweights.py + cargo run -p quantize-tool.

          Contents (inside the tarball, under \`xtr-gguf-${REV}/\`):
          - config.json
          - tokenizer.json
          - xtr.gguf

          Scryd's daemon expects these three files in \`/var/lib/scryd/assets/\` (the install-script-staged location) before the scryd daemon starts.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$TARBALL" "$SHA_FILE" --clobber
          else
            gh release create "$tag" --title "witchcraft xtr-int4 assets @ ${REV}" --notes-file "$notes_file" "$TARBALL" "$SHA_FILE"
          fi
          rm -f "$notes_file"
        shell: bash
