[package]
name = "scryd-search"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { version = "1", features = ["v5"] }
scryd-storage = { path = "../scryd-storage" }
scryd-log = { path = "../scryd-log" }

# Witchcraft is the default production indexer. Per-arch / per-OS
# features mirror build-and-packaging slice §3 Decision 2 + the
# upstream README's recommended sets. Only Unix-y targets get the dep
# — Windows ports are a v2 follow-up that will require a non-trivial
# IPC + service-manager port anyway.
#
# Tests and dev builds that want a stub indexer can opt out with
# `cargo build --no-default-features` / `cargo test --no-default-features`,
# which falls back to InMemoryIndexer.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized", "fbgemm", "hybrid-dequant"] }
candle-core = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized"] }
candle-core = { workspace = true, optional = true }

# Apple Silicon: t5-quantized + metal (witchcraft README's recommended
# Apple Silicon set).
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized", "metal"] }
candle-core = { workspace = true, optional = true }

# Intel Mac: t5-quantized + fbgemm + hybrid-dequant (witchcraft
# README's recommended Intel Mac set).
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized", "fbgemm", "hybrid-dequant"] }
candle-core = { workspace = true, optional = true }

[features]
default = ["witchcraft-backend"]
# Pull in the dropbox/witchcraft binding. Compiles candle-core +
# fbgemm-rs (x86_64) or candle-core only (aarch64); first build is
# slow but cached afterwards. On non-Linux hosts the feature flag is
# inert because the witchcraft + candle-core deps only resolve under
# the Linux target tables above.
witchcraft-backend = ["dep:witchcraft", "dep:candle-core"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json"] }
tempfile = "3"

# The witchcraft integration test only builds when the upstream binding
# is wired in. Without `required-features` cargo would try to compile
# the test against unresolved imports.
[[test]]
name = "witchcraft"
path = "tests/witchcraft.rs"
required-features = ["witchcraft-backend"]
