[package]
name = "scryd"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "scryd"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
scryd-config = { path = "../crates/scryd-config" }
scryd-runtime = { path = "../crates/scryd-runtime" }
scryd-log = { path = "../crates/scryd-log" }
urlencoding = "2"
is-terminal = "0.4"
toml_edit = { workspace = true }
rpassword = { workspace = true }
regex = "1"
nix = { version = "0.29", default-features = false, features = ["user", "fs"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
