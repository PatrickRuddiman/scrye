[package]
name = "scryd-search"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { version = "1", features = ["v5"] }
scryd-storage = { path = "../scryd-storage" }
scryd-log = { path = "../scryd-log" }

# Witchcraft is OPTIONAL and gated behind the `witchcraft-backend`
# feature flag. Default builds use the InMemoryIndexer and never pull in
# witchcraft / candle-core / fbgemm-rs. Per-arch features mirror
# build-and-packaging slice §3 Decision 2.
[target.'cfg(target_arch = "x86_64")'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized", "fbgemm", "hybrid-dequant"] }
candle-core = { workspace = true, optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
witchcraft = { workspace = true, optional = true, features = ["t5-quantized"] }
candle-core = { workspace = true, optional = true }

[features]
default = []
# Pull in the dropbox/witchcraft binding. Compiles candle-core +
# fbgemm-rs (x86_64) or candle-core only (aarch64); first build is
# slow. Off by default so the workspace stays buildable on hosts
# without the upstream toolchain.
witchcraft-backend = ["dep:witchcraft", "dep:candle-core"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json"] }
tempfile = "3"

# The witchcraft integration test only builds when the upstream binding
# is wired in. Without `required-features` cargo would try to compile
# the test against unresolved imports.
[[test]]
name = "witchcraft"
path = "tests/witchcraft.rs"
required-features = ["witchcraft-backend"]
