# cargo-deny configuration for the scryd workspace.
#
# Goal: every shipping dependency carries a license compatible with our
# Apache-2.0 release. Anything outside this allow-list (or unencoded in a
# crate's metadata) breaks CI before a release artifact is uploaded.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "warn"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
