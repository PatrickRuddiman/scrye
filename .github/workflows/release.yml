name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  license-check:
    name: license check (cargo deny)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (${{ matrix.target }})
    needs: license-check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            cross: false
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            cross: true
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross
        if: matrix.cross == true
        run: cargo install cross --locked --version 0.2.5

      - name: verify systemd unit template
        run: |
          set -euo pipefail
          rendered="$(mktemp -d)/scryd.service"
          sed -e 's/__UID__/1000/g' -e 's/__USER__/scryd/g' \
              ops/scryd.service.in > "$rendered"
          systemd-analyze verify "$rendered"
        shell: bash

      - name: cargo test --workspace
        if: matrix.cross == false
        run: cargo test --workspace --target ${{ matrix.target }}
        shell: bash

      - name: cargo build --release
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p scryd -p scryd-fetch-weights
          else
            cargo build --release --target ${{ matrix.target }} -p scryd -p scryd-fetch-weights
          fi
        shell: bash

      - name: install.sh smoke test
        if: matrix.cross == false
        run: bash tests/install_sh.sh
        shell: bash

      - name: package tarball
        id: package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-dev}"
          stage="$(mktemp -d)"
          out="scryd-${tag}-${{ matrix.arch }}-linux"
          mkdir -p "$stage/$out"
          cp "target/${{ matrix.target }}/release/scryd" "$stage/$out/"
          cp "target/${{ matrix.target }}/release/scryd-fetch-weights" "$stage/$out/"
          cp LICENSE "$stage/$out/"
          cp ops/scryd.service.in "$stage/$out/"
          cp ops/scryd.tmpfiles.in "$stage/$out/"
          cp ops/install.sh "$stage/$out/"
          cp ops/uninstall.sh "$stage/$out/"
          cp ops/README.install.md "$stage/$out/"
          tar -czf "${out}.tar.gz" -C "$stage" "$out"
          sha256sum "${out}.tar.gz" | awk '{print $1}' > "${out}.sha256"
          echo "tarball=${out}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256_file=${out}.sha256" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scryd-${{ matrix.arch }}-linux
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.sha256_file }}

  release:
    name: github release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: aggregate artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release/ \;
          (cd release && cat *.sha256 | sort -u > SHA256SUMS && rm -f *.sha256)
          ls -la release

      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release/*
